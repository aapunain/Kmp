#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
# Disabled because Room's KSP task (com.google.devtools.ksp.gradle.KspAATask) cannot be
# serialized into the configuration cache, which is a hard build failure rather than a
# warning. Re-enable when KSP supports it; nothing else in this build needs it off.
org.gradle.configuration-cache=false
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true